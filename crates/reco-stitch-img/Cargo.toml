[package]
publish = false
name = "reco-stitch-img"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Standalone GPU image stitcher for pipeline benchmarking and optimization"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"

[[bin]]
name = "reco-stitch-img"
path = "src/main.rs"

[dependencies]
reco-core = { path = "../reco-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

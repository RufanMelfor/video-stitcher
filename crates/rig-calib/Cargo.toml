[package]
publish = false
name = "rig-calib"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"
description = "Standalone lens + rig stitch calibration tool with live GPU preview"

[[bin]]
name = "rig-calib"
path = "src/main.rs"

[features]
profiling = ["reco-core/profiling", "reco-io/profiling", "reco-calibrate/profiling"]

[dependencies]
reco-core = { path = "../reco-core" }
reco-control = { path = "../reco-control" }
reco-io = { path = "../reco-io", features = ["ffmpeg", "config"] }
reco-calibrate = { path = "../reco-calibrate", features = ["io"] }

slint = { version = "~1.15", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "accessibility", "compat-1-2", "unstable-wgpu-28"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-log = "0.2"
tracing-appender = "0.2"

[build-dependencies]
slint-build = "1.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package]
publish = false
name = "reco-update"
version = "1.0.0-beta.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-update for RECO Panopitch: GitHub release check, verified download, swap-after-exit installer (Windows, macOS, Linux)"

[dependencies]
anyhow = "1"
log = "0.4"
semver = "1"
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# macOS extracts with the system `ditto`, which keeps permissions,
# symlinks and code signatures of an .app bundle intact.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

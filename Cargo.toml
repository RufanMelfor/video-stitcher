[workspace]
resolver = "3"
members = [
    "crates/reco-core",
    "crates/reco-cli",
    "crates/reco-io",
    "crates/reco-autocam",
    "crates/reco-calibrate",
    "crates/reco-control",
    "crates/reco-detect",
    "crates/reco-gui",
    "crates/reco-obs",
    "crates/reco-stitch-img",
    "crates/rig-calib",
]
# The `fuzz` subcrate is intentionally out of the workspace because
# libfuzzer-sys requires nightly-specific compiler flags that would
# otherwise constrain the rest of the workspace. Run targets via
# `cargo +nightly fuzz run <target>` from the fuzz/ directory.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
repository = "https://github.com/reco-project/video-stitcher"

[workspace.dependencies]
tracing = "0.1"
# tracing-subscriber + env-filter: structured log output with RUST_LOG-
# style filtering, feature-gated JSON emit for diagnostic bundles.
# tracing-log: auto-bridges legacy `log::*` macro calls to tracing so
# existing call sites in reco-core / reco-io / reco-calibrate keep
# working while we migrate incrementally. Registered once per binary.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
tracing-log = "0.2"

[profile.release]
strip = true
lto = "thin"

# Fix khronos_api 3.1.0 build.rs bug on Windows: build script uses current_dir()
# which is not guaranteed to be the package root. Replaced with CARGO_MANIFEST_DIR.
[patch.crates-io]
khronos_api = { path = "vendor/khronos_api" }
# Patched to inline OUT_DIR-generated private.rs content so Windows Defender
# cannot block the build-script file writes. Build scripts emit only stdout;
# the generated module is hardcoded directly in each crate's source.
serde_core = { path = "vendor/serde_core" }
serde       = { path = "vendor/serde" }
thiserror   = { path = "vendor/thiserror" }
serde_json  = { path = "vendor/serde_json" }
# naga's build script uses cfg_aliases to emit cfg flags; that binary gets
# blocked by Defender. Patched to emit the same flags via plain println!.
naga        = { path = "vendor/naga" }
# wgpu-hal's build script also uses cfg_aliases. Same Defender-bypass patch.
wgpu-hal    = { path = "vendor/wgpu-hal" }
# aligned-vec (pulled in via Slint's build-time image/AVIF codec stack:
# i-slint-compiler -> image -> ravif -> rav1e -> aligned-vec) uses the
# `equator` crate's proc-macro for its internal assert!, which hits a
# known rustc regression on 1.92 (rust-lang/rust#140219, "expected
# identifier, found metavariable"). Patched to drop the `equator`
# dependency and use the builtin assert! instead - functionally
# identical for an internal invariant check, no behavior change.
aligned-vec = { path = "vendor/aligned-vec" }
# keyboard-types wraps its `Modifiers` bitflags struct's serde derive in a
# path-qualified `derive(serde::Serialize, serde::Deserialize)`, forwarded
# through the `bitflags!` macro - same rust-lang/rust#140219 regression
# class as aligned-vec above, just triggered via a different macro path.
# Patched to use plain imported names instead of qualified paths.
keyboard-types = { path = "vendor/keyboard-types" }

# SPIKE: wgpu 28 interop with Slint. Fork removed; if wgpu 28 doesn't
# have the shaderDrawParameters regression, no patch is needed.
